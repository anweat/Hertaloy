<!doctype html>
<meta charset="utf-8" />
<title>Hertaloy 观测</title>
<style>
  :root {
    --bg: #0e1013;
    --bg-2: #12151a;
    --panel: #171b22;
    --panel-2: #1d222b;
    --line: #262c37;
    --line-soft: #1f242d;
    --dim: #6b7688;
    --text: #d8dee9;
    --text-hi: #f0f4fa;

    /* 流的四种来路各一个色，与线型一起构成判别 —— 但判别来自字段，不来自枚举 */
    --edge: #5b8dd9;     /* 内网边：注册期证实 */
    --gw: #d9a05b;       /* 网关：别名解析 */
    --signal: #9b7fd4;   /* 信号：容器自己发的 */
    --outside: #4fb3a5;  /* 图外：人 / CLI */

    --run: #5b8dd9;
    --fail: #d9636c;
    --ok: #6fae7d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 800px at 20% -10%, #171b22 0%, var(--bg) 60%);
    color: var(--text);
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: grid; grid-template-columns: 1fr minmax(300px, 380px); height: 100vh; }

  /* ── 画布 ───────────────────────────────────────────── */
  #canvas { position: relative; overflow: auto; padding: 28px 28px 28px 76px; }
  /* 线画在盒子**上层** —— 盒子背景不透明，压在下面等于没画。
     交叉是节点图的常态，靠低不透明度 + 圆头细线让它不抢戏。 */
  #wires { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5; }
  #tree { position: relative; z-index: 1; }

  /** 外部入口带：人投的消息从这条带子进来。它在画布**边缘**，不是图里的节点。 */
  #gutter {
    position: absolute; left: 0; top: 0; bottom: 0; width: 48px;
    border-right: 1px dashed var(--line);
    background: linear-gradient(90deg, rgba(79,179,165,.06), transparent);
  }
  #gutter span {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space: nowrap; color: var(--outside); opacity: .7;
    font-size: 10px; letter-spacing: .28em;
  }

  .box {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 10px 0;
    padding: 9px 11px 11px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 6px 18px -12px #000;
  }
  .box.slot {
    border-style: dashed; background: none; box-shadow: none;
    border-color: var(--line-soft);
  }
  .box.slot.empty { opacity: .4; }
  .box.terminal { opacity: .78; }

  .hd { display: flex; gap: 9px; align-items: baseline; cursor: pointer; user-select: none; }
  .hd:hover .name { color: var(--text-hi); }
  .name { font-weight: 600; letter-spacing: .01em; }
  .meta { color: var(--dim); font-size: 10.5px; }
  .meta.open { color: var(--ok); }
  .meta.waits { color: var(--gw); }
  .bar { flex: 1; height: 2px; border-radius: 2px; background: var(--line-soft); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); opacity: .55; }

  .nodes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .node {
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px 7px;
    background: #1a1f27; cursor: pointer; min-width: 92px;
    transition: border-color .12s, transform .12s;
  }
  .node:hover { border-color: #3d475a; transform: translateY(-1px); }
  .node.running { border-color: var(--run); box-shadow: 0 0 0 1px rgba(91,141,217,.18); }
  .node.failed  { border-color: var(--fail); box-shadow: 0 0 0 1px rgba(217,99,108,.18); }
  .node.done { opacity: .72; }
  .node .label { font-weight: 600; font-size: 12px; margin-bottom: 5px; }
  .ports { display: flex; flex-wrap: wrap; gap: 4px; }
  .p {
    font-size: 9.5px; line-height: 1.5; padding: 0 5px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .p.recv { border-color: #2f4463; }
  .p.emit { border-color: #3f4a30; }
  .p.gw   { border-color: var(--gw); color: var(--gw); }
  .p.servo { box-shadow: 0 0 0 1px rgba(91,141,217,.25) inset; }

  /* ── 侧栏 ───────────────────────────────────────────── */
  #side { border-left: 1px solid var(--line); display: flex; flex-direction: column;
          background: var(--bg-2); min-width: 0; }
  #status { padding: 9px 14px; color: var(--dim); font-size: 10.5px;
            border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  #status b { color: var(--text); font-weight: 600; }
  .sec { border-bottom: 1px solid var(--line); padding: 11px 14px; overflow: auto; min-height: 0; }
  .sec h2 { margin: 0 0 9px; font-size: 10px; letter-spacing: .16em; color: var(--dim);
            text-transform: uppercase; font-weight: 600; }
  #detail { flex: 1 1 52%; }
  #legend { flex: 0 0 auto; }
  #outside, #authz { flex: 1 1 24%; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 11px;
        color: #c6cfdd; }
  .row { display: flex; gap: 8px; font-size: 10.5px; padding: 1.5px 0; align-items: baseline; }
  .row .seq { color: var(--outside); }
  .row .yes { color: var(--ok); } .row .no { color: var(--fail); }
  .row .who { color: var(--text); }
  .lg { display: flex; align-items: center; gap: 7px; font-size: 10.5px; padding: 2px 0;
        color: var(--dim); }
  .lg svg { flex: 0 0 34px; }
</style>

<div id="app">
  <div id="canvas">
    <div id="gutter"><span>外部注入</span></div>
    <svg id="wires"></svg>
    <div id="tree"></div>
  </div>
  <div id="side">
    <div id="status">连接中…</div>
    <div class="sec" id="detail"><h2>配置</h2><pre id="detail-body">点任意一个容器 / 子槽 / 节点</pre></div>
    <div class="sec" id="legend"><h2>线型</h2><div id="legend-body"></div></div>
    <div class="sec" id="outside"><h2>图外来的（人 / CLI 投的）</h2><div id="outside-body"></div></div>
    <div class="sec" id="authz"><h2>授权流水</h2><div id="authz-body"></div></div>
  </div>
</div>

<script type="module">
const TOKEN = "__HERTALOY_TOKEN__";
const SVGNS = "http://www.w3.org/2000/svg";
/** 401/403/404 也是合法 JSON —— 不看状态码就会把 `{error:…}` 当成数据渲染。 */
async function api(path) {
  const res = await fetch(path, { headers: { "x-hertaloy-token": TOKEN } });
  const body = await res.json().catch(() => null);
  if (!res.ok) {
    const why = body && body.error ? body.error : res.status;
    throw new Error(`${path}：${why}`);
  }
  return body;
}

/** 配置流：不可变、按版本寻址 ⇒ 拉一次，缓存永不失效。不在每帧的场景里。 */
let templates = {};
let scene = { cells: [], flows: [], tethers: [], cards: [], range: { from: 1, to: 1 }, viewport: "" };

/**
 * 四个集合都按 `id` 合并 —— **页面不自己拼任何键**。
 *
 * 原来 tether 没有 id，页面按 `from|to|relation` 拼，而服务端按 `from to relation`
 * 拼：`removed` 里的键在这边永远匹配不到，**解除的等待关系一直画在图上**
 * （审核 F03）。身份现在只在 scene 那一处给出。
 */
function apply(delta) {
  for (const coll of ["cells", "flows", "cards", "tethers"]) {
    const d = delta[coll];
    if (d === undefined) continue;
    const map = new Map(scene[coll].map((x) => [x.id, x]));
    for (const k of d.removed ?? []) map.delete(k);
    for (const x of [...(d.added ?? []), ...(d.changed ?? [])]) map.set(x.id, x);
    scene[coll] = [...map.values()];
  }
  if (delta.range !== undefined) scene.range = delta.range;
  if (delta.viewport !== undefined) scene.viewport = delta.viewport;
}

/* ── 判别：全部来自**字段有无**，没有任何枚举 ───────────────────────
 *
 * 这与内核判信封 source 是同一条规则（见 MessageSource：「三种情形，靠字段
 * 有无区分，不需要标签」）。第五种网关模式出现时这里一行都不用改。
 */
function portKind(decl) {
  const c = ["p", decl.direction === "receive" ? "recv" : "emit"];
  if (decl.alias !== undefined || decl.callback !== undefined || decl.reply !== undefined) c.push("gw");
  const vars = decl.servo && decl.servo.vars ? Object.keys(decl.servo.vars).length : 0;
  if (vars > 0) c.push("servo");
  return c.join(" ");
}

/** 流的样式：四个字段的组合，不是一个 kind 字段。 */
function wireStyle(f) {
  if (f.at.length === 0) {
    return { color: "var(--dim)", dash: "3 5", width: 1, glow: 0, name: "声明了，没走过" };
  }
  if (f.from === null) {
    return { color: "var(--outside)", dash: "0", width: 1.4, glow: 1, name: "图外来的" };
  }
  if (f.from.port === undefined) {
    return { color: "var(--signal)", dash: "7 3 2 3", width: 1.4, glow: 1, name: "信号" };
  }
  if (f.alias !== undefined) {
    // 确定度越高越粗越实 —— 边和隧道是同一元素的两个确定度
    return { color: "var(--gw)", dash: f.certainty > 0.7 ? "0" : "6 4",
             width: 1 + f.certainty * 1.6, glow: 1, name: "网关（别名）" };
  }
  return { color: "var(--edge)", dash: "0", width: 1.6, glow: 1, name: "内网边" };
}

/* ── 模板关联：cell.identity 存的就是 templateRef ──────────────────── */
function templateOf(cell) {
  if (cell.kind !== "node") return templates[cell.identity];
  const owner = scene.cells.find((c) => c.id === cell.parent);
  return owner ? templates[owner.identity] : undefined;
}
function portsOf(cell) {
  const tpl = templateOf(cell);
  const nodeId = cell.id.split("#").pop();
  return (tpl && tpl.nodes && tpl.nodes[nodeId] && tpl.nodes[nodeId].ports) || {};
}
function detailOf(cell) {
  if (cell.kind === "instance")
    return { 实例: cell.id, 模板: cell.identity, 相位: cell.phase,
             生存期: cell.span, 覆盖率: cell.coverage, 定义: templates[cell.identity] };
  if (cell.kind === "slot")
    return { 子槽: cell.label, 所属: cell.parent, 子模板: cell.identity,
             锚点: cell.ports, 定义: templates[cell.identity] };
  const nodeId = cell.id.split("#").pop();
  const tpl = templateOf(cell);
  return { 节点: nodeId, 所属实例: cell.parent, 身份: cell.identity, 相位: cell.phase,
           定义: tpl && tpl.nodes ? tpl.nodes[nodeId] : undefined };
}
/**
 * 选中的是**身份**不是那一刻的对象：场景每帧重算，`cell` 会换成新的一份。
 * 记 id、每帧按 id 重新取，详情才会跟着状态变 —— 否则点开之后就冻在那一刻。
 */
let selected = null;
function show(cell) {
  selected = cell.id;
  renderDetail();
}
function renderDetail() {
  const cell = scene.cells.find((c) => c.id === selected);
  const body = document.getElementById("detail-body");
  if (cell === undefined) {
    body.textContent = selected === null ? "点任意一个容器 / 子槽 / 节点" : `${selected}（已不在视口里）`;
    return;
  }
  body.textContent = JSON.stringify(detailOf(cell), null, 2);
}

/* ── 渲染：CSS 管嵌套，SVG 管连线 ─────────────────────────────────── */
const childrenOf = (id) => scene.cells.filter((c) => c.parent === id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

function renderNode(cell) {
  const n = el("div", "node " + cell.phase);
  n.dataset.cell = cell.id;
  n.append(el("div", "label", cell.label));
  const pr = el("div", "ports");
  for (const [name, decl] of Object.entries(portsOf(cell))) {
    const s = el("span", portKind(decl), name);
    s.dataset.anchor = cell.id + "::" + name;
    s.title = JSON.stringify(decl, null, 2);
    pr.append(s);
  }
  n.append(pr);
  n.onclick = (e) => { e.stopPropagation(); show(cell); };
  return n;
}

function renderBox(cell) {
  const kids = childrenOf(cell.id);
  const slot = cell.kind === "slot";
  const box = el("div", "box" + (slot ? " slot" + (kids.length === 0 ? " empty" : "") : "") +
                        (cell.phase === "done" ? " terminal" : ""));
  box.dataset.cell = cell.id;

  const hd = el("div", "hd");
  hd.append(el("span", "name", slot ? "▢ " + cell.label : cell.label));
  hd.append(el("span", "meta" + (cell.phase === "idle" ? " open" : ""), slot ? "子槽" : cell.phase));
  // 盒子上是**结构覆盖率**（有环时分母不动），不是完成度
  if (cell.coverage) {
    const bar = el("div", "bar");
    const fill = el("i");
    fill.style.width =
      Math.round((cell.coverage.done / Math.max(1, cell.coverage.total)) * 100) + "%";
    bar.append(fill);
    hd.append(bar, el("span", "meta", cell.coverage.done + "/" + cell.coverage.total));
  }
  const waiting = scene.tethers.filter((t) => t.relation === "waits" && t.from === cell.id);
  if (waiting.length > 0) {
    hd.append(el("span", "meta waits", "等 " + waiting.map((w) => w.to.split("/").pop()).join("、")));
  }
  hd.onclick = (e) => { e.stopPropagation(); show(cell); };
  box.append(hd);

  const nodeKids = kids.filter((k) => k.kind === "node");
  if (nodeKids.length > 0) {
    const wrap = el("div", "nodes");
    for (const k of nodeKids) wrap.append(renderNode(k));
    box.append(wrap);
  }
  for (const k of kids) if (k.kind !== "node") box.append(renderBox(k));
  return box;
}

/** 锚点 → 画布坐标。端口缺席时落在**盒子边缘**（信号就是这样出来的）。 */
function anchorAt(canvas, ref, side) {
  const base = canvas.getBoundingClientRect();
  const dx = canvas.scrollLeft - base.left;
  const dy = canvas.scrollTop - base.top;
  if (ref !== null && ref.port !== undefined) {
    const node = canvas.querySelector('[data-anchor="' + CSS.escape(ref.cell + "::" + ref.port) + '"]');
    if (node !== null) {
      const r = node.getBoundingClientRect();
      return { x: r.left + dx + (side === "out" ? r.width : 0), y: r.top + dy + r.height / 2 };
    }
  }
  const cellId = ref === null ? null : ref.cell;
  if (cellId !== null) {
    const boxEl = canvas.querySelector('[data-cell="' + CSS.escape(cellId) + '"]');
    if (boxEl !== null) {
      const r = boxEl.getBoundingClientRect();
      return { x: r.left + dx + (side === "out" ? r.width : 0), y: r.top + dy + r.height / 2 };
    }
  }
  return null; // 图外：由调用方落到入口带上
}

function drawWires() {
  const canvas = document.getElementById("canvas");
  const svg = document.getElementById("wires");
  svg.setAttribute("width", String(canvas.scrollWidth));
  svg.setAttribute("height", String(canvas.scrollHeight));
  svg.replaceChildren();

  const defs = document.createElementNS(SVGNS, "defs");
  svg.append(defs);

  let n = 0;
  for (const f of scene.flows) {
    const to = anchorAt(canvas, f.to, "in");
    if (to === null) continue;
    // 图外来的：从左侧入口带出发 —— 画布边缘的固定位置，不是图里的假节点
    const from = f.from === null ? { x: 24, y: to.y } : anchorAt(canvas, f.from, "out");
    if (from === null) continue;

    const st = wireStyle(f);
    const mid = (from.x + to.x) / 2;
    const d = "M " + from.x + " " + from.y +
              " C " + mid + " " + from.y + ", " + mid + " " + to.y + ", " + to.x + " " + to.y;

    const id = "w" + n++;

    /**
     * 先描一道暗边再画线 —— 线要从盒子上方穿过去，没有这道边它会和下面的
     * 文字糊在一起。比"绕开盒子"便宜得多，效果也够。
     */
    const halo = document.createElementNS(SVGNS, "path");
    halo.setAttribute("d", d);
    halo.setAttribute("fill", "none");
    halo.setAttribute("stroke", "#0e1013");
    halo.setAttribute("stroke-width", String(st.width + 2.4));
    halo.setAttribute("stroke-linecap", "round");
    halo.setAttribute("opacity", "0.42");
    svg.append(halo);

    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("id", id);
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", st.color);
    path.setAttribute("stroke-width", String(st.width));
    path.setAttribute("stroke-linecap", "round");
    if (st.dash !== "0") path.setAttribute("stroke-dasharray", st.dash);
    path.setAttribute("opacity", String(0.34 + 0.5 * Math.min(1, f.certainty)));
    svg.append(path);

    // 落点上一个小圆 —— 一眼看出这条线接在哪个端口上
    const cap = document.createElementNS(SVGNS, "circle");
    cap.setAttribute("cx", String(to.x));
    cap.setAttribute("cy", String(to.y));
    cap.setAttribute("r", "2");
    cap.setAttribute("fill", st.color);
    cap.setAttribute("opacity", st.glow === 1 ? "0.85" : "0.4");
    svg.append(cap);

    /**
     * 光点：一条流上跑几颗、跑多快，由它自己的活跃度决定 —— 不另设参数。
     * 没走过的流（`at` 为空）不跑光点，静止的图就是静止的。
     */
    if (st.glow === 1) {
      const count = Math.min(3, 1 + Math.floor(f.activity * 6));
      const dur = (2.6 - Math.min(1.6, f.activity * 4)).toFixed(2) + "s";
      for (let i = 0; i < count; i++) {
        const dot = document.createElementNS(SVGNS, "circle");
        dot.setAttribute("r", String(1.6 + st.width * 0.35));
        dot.setAttribute("fill", st.color);
        dot.setAttribute("opacity", "0.9");
        const motion = document.createElementNS(SVGNS, "animateMotion");
        motion.setAttribute("dur", dur);
        motion.setAttribute("repeatCount", "indefinite");
        motion.setAttribute("begin", (i * (parseFloat(dur) / count)).toFixed(2) + "s");
        motion.setAttribute("rotate", "auto");
        const mp = document.createElementNS(SVGNS, "mpath");
        mp.setAttribute("href", "#" + id);
        motion.append(mp);
        dot.append(motion);
        svg.append(dot);
      }
    }
  }
}

function renderLegend() {
  const seen = new Map();
  for (const f of scene.flows) {
    const st = wireStyle(f);
    if (!seen.has(st.name)) seen.set(st.name, st);
  }
  const rows = [...seen.values()].map((st) => {
    const row = el("div", "lg");
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("width", "34"); svg.setAttribute("height", "10");
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", "M 1 5 L 33 5");
    p.setAttribute("stroke", st.color);
    p.setAttribute("stroke-width", String(st.width));
    if (st.dash !== "0") p.setAttribute("stroke-dasharray", st.dash);
    svg.append(p);
    row.append(svg, el("span", "", st.name));
    return row;
  });
  document.getElementById("legend-body").replaceChildren(...rows);
}

function render() {
  const roots = scene.cells.filter((c) => c.parent === null);
  document.getElementById("tree").replaceChildren(...roots.map(renderBox));

  const outside = scene.flows.filter((f) => f.from === null && f.at.length > 0);
  const rows = [];
  for (const f of outside) {
    for (const seq of f.at) {
      const r = el("div", "row");
      r.append(el("span", "seq", "#" + seq), el("span", "", "→ " + f.to.cell + "." + f.to.port));
      rows.push(r);
    }
  }
  rows.sort((a, b) => Number(a.textContent.slice(1)) - Number(b.textContent.slice(1)));
  document.getElementById("outside-body").replaceChildren(...rows);

  const st = document.getElementById("status");
  st.replaceChildren();
  st.append(el("span", "", "视口 "), el("b", "", scene.viewport || "—"),
            el("span", "", " 序号 " + scene.range.from + "–" + scene.range.to),
            el("span", "", " · " + scene.cells.length + " 单元"),
            el("span", "", " · " + scene.flows.length + " 流"));

  renderLegend();
  requestAnimationFrame(drawWires);
}

async function renderAuthz() {
  const list = await api("/authz?limit=30");
  const rows = list.slice().reverse().map((e) => {
    const r = el("div", "row");
    r.append(el("span", e.allowed ? "yes" : "no", e.allowed ? "✓" : "✗"),
             el("span", "who", e.actor), el("span", "meta", e.op), el("span", "", e.target));
    return r;
  });
  document.getElementById("authz-body").replaceChildren(...rows);
}

/**
 * 配置流按需补齐。
 *
 * 模板按精确版本寻址、内容不可变，所以**缓存永不失效** —— 但缓存的**集合**
 * 会变：spawn 出新的子实例之后就多了一份定义。原来只在启动时拉一次，
 * 于是后来出现的实例节点没有端口、点开没有配置，而且没有任何提示。
 *
 * 已经有的 ref 一律不重取；只要出现一个不认识的就整份重拉一次
 * （服务端给的就是"这个视口用到的全部"，比逐个请求少一次往返）。
 */
/**
 * 只问**实例**用的模板 —— 那正是 `/templates` 承诺的范围。
 *
 * 上一版把子槽的 `identity` 也算进来了。子槽的那份是**已声明依赖**：
 * 槽还没实例化时 `/templates` 里根本没有它，于是每帧都发现"缺一个"、
 * 每帧都重拉一次、每帧仍然缺 —— 一个不会收敛的空转（审核指出）。
 *
 * 「已声明依赖」与「运行实例所用模板」是两个查询范围，前者目前没有接口。
 * 在它出现之前，这里不假装能拿到；`asked` 也兜住一层：问过一次仍然没有的
 * ref 不再反复问，免得服务端行为变化时又转起来。
 */
const asked = new Set();
async function topUpTemplates() {
  const wanted = scene.cells
    .filter((c) => c.kind === "instance" && c.identity)
    .map((c) => c.identity);
  const missing = wanted.filter((ref) => templates[ref] === undefined && !asked.has(ref));
  if (missing.length === 0) return;
  for (const ref of missing) asked.add(ref);
  templates = await api("/templates");
}

addEventListener("resize", () => requestAnimationFrame(drawWires));
document.getElementById("canvas").addEventListener("scroll", () => requestAnimationFrame(drawWires));

const status = (text) => {
  document.getElementById("status").textContent = text;
};

/** 凭据失效（服务重启换了 token）—— 退避重连救不了，只能刷新页面。 */
class Expired extends Error {}

/**
 * 读一段流，直到它结束或出错。
 *
 * **每条新连接先把本地基线清空**（审核 F04）。服务端每条连接的第一帧是
 * 「空场景 → 当前场景」的差量 —— 它是一份**基线**，不是接着上一条流的增量。
 * 断线期间旧流里的东西可能已经离开消息窗口，新基线里不会再提它们，
 * 于是继续合并就会让它们**永久残留**在画面上。
 *
 * 合并只在**一条连接之内**成立；跨连接要重来。
 */
async function consume() {
  const res = await fetch("/scene/stream", { headers: { "x-hertaloy-token": TOKEN } });
  if (res.status === 401 || res.status === 403) {
    await res.body?.cancel();
    throw new Expired(res.status === 401 ? "凭据已失效" : "无权读取");
  }
  if (!res.ok) throw new Error(`/scene/stream：${res.status}`);

  // ★ 基线重来：本地不留上一条连接的残余
  scene = { cells: [], flows: [], tethers: [], cards: [], range: { from: 1, to: 1 }, viewport: "" };
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const chunk = await reader.read();
    if (chunk.done) return;
    buf += dec.decode(chunk.value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop() || "";
    let touched = false;
    for (const l of lines) {
      if (l.length === 0) continue;
      const frame = JSON.parse(l);
      /**
       * 服务端在流**中途**失败时会发一帧 `{error}` 再收口（头已经是 200，
       * 状态码改不回来了）。把它当差量合并进去只会污染场景，所以单独认。
       */
      if (frame.error !== undefined) throw new Error(frame.error);
      apply(frame);
      touched = true;
    }
    if (!touched) continue;
    await topUpTemplates();
    render();
    renderDetail();
    // 侧栏两块各自收口：一块挂了不该把整条流带下去
    renderAuthz().catch((e) => {
      document.getElementById("authz-body").replaceChildren(el("div", "row", `读不到：${e.message}`));
    });
  }
}

/**
 * 流断了就重连，退避到 8 秒封顶。
 *
 * 服务重启、机器休眠、代理超时都会断流；原来断了就停在"流已结束"四个字上，
 * 而画面还留着旧数据 —— 看着像活的，其实早就不动了。
 *
 * **临时断线与凭据失效要分开**（审核 F05）：服务在原端口重启会换一个 token，
 * 页面里这个 `TOKEN` 是加载时内嵌的常量，退避多少次都不会变成新的那个。
 * 那种情况下继续重连是纯粹的空转，得让人知道要刷新。
 */
async function main() {
  templates = await api("/templates");
  let backoff = 500;
  for (;;) {
    try {
      await consume();
      backoff = 500;
      status("流已结束，重连中…");
    } catch (e) {
      if (e instanceof Expired) {
        // 页面里的 token 是加载时定死的，重连救不回来
        status(`${e.message} —— 服务可能重启过，请刷新页面`);
        return;
      }
      status(`断开：${e.message}，${Math.round(backoff / 100) / 10}s 后重连`);
      backoff = Math.min(8000, backoff * 2);
    }
    await new Promise((r) => setTimeout(r, backoff));
  }
}
main().catch((e) => status("出错：" + e.message));
</script>
